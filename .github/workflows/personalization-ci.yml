name: Personalization CI

on:
    pull_request:
        paths:
            - "services/personalizationService/**"
            - "infra/personalization/**"
            - "contracts/openapi/personalization/**"
            - ".github/workflows/personalization-ci.yml"
            - ".editorconfig"
            - ".gitattributes"
    push:
        branches: [main]
        paths:
            - "services/personalizationService/**"
            - "infra/personalization/**"
            - "contracts/openapi/personalization/**"
            - ".github/workflows/personalization-ci.yml"
            - ".editorconfig"
            - ".gitattributes"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: personalization-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality:
        name: Python quality and package
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        defaults:
            run:
                working-directory: services/personalizationService
        env:
            UV_PYTHON_DOWNLOADS: never
            UV_NO_PROGRESS: "1"
        steps:
            - name: Check out repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false
            - name: Set up Python
              uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
              with:
                  python-version: "3.14"
            - name: Install dependency manager
              run: python -m pip install uv==0.13.5
            - name: Install locked dependencies
              run: python -m uv sync --locked
            - name: Check lint
              run: python -m uv run --locked ruff check . ../../infra/personalization
            - name: Check formatting
              run: python -m uv run --locked ruff format --check . ../../infra/personalization
            - name: Check types
              run: python -m uv run --locked mypy
            - name: Check infrastructure types
              run: python -m uv run --locked mypy ../../infra/personalization
            - name: Run tests
              run: python -m uv run --locked pytest
            - name: Verify versioned OpenAPI contract
              run: >-
                  python -m uv run --locked python -m
                  personalization.interfaces.http.export_openapi
                  --check --output
                  ../../contracts/openapi/personalization/v1/openapi.json
            - name: Build package
              run: python -m uv build --no-sources


    docker:
        name: Docker packaging and database isolation
        needs: quality
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        env:
            PERSONALIZATION_IMAGE_TAG: 0.1.0-${{ github.sha }}
            PERSONALIZATION_GIT_SHA: ${{ github.sha }}
        steps:
            - name: Check out repository
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false
            - name: Prepare temporary local secrets
              run: python3 infra/personalization/provision_local.py
            - name: Verify Docker packaging and persistence
              run: python3 infra/personalization/verify_stack.py
