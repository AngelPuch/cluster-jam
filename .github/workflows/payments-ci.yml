name: Payments CI

on:
    pull_request:
        paths:
            - "services/paymentsService/**"
            - "infra/payments/**"
            - "contracts/events/payments.v1.md"
            - ".github/workflows/payments-ci.yml"
    push:
        branches: [main]
        paths:
            - "services/paymentsService/**"
            - "infra/payments/**"
            - "contracts/events/payments.v1.md"
            - ".github/workflows/payments-ci.yml"

permissions:
    contents: read

concurrency:
    group: payments-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    payments:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        services:
            rabbitmq:
                image: rabbitmq:4.3.6-management@sha256:54cb013d76cd1fd6c0a0708f34062ad61c452bb6f016b434c6c33f1a765d2b58
                env:
                    RABBITMQ_DEFAULT_USER: clusterjam
                    RABBITMQ_DEFAULT_PASS: local-development-only
                    RABBITMQ_DEFAULT_VHOST: payments_test_ci
                ports:
                    - 5672:5672
                    - 15672:15672
                options: >-
                    --health-cmd "rabbitmq-diagnostics -q ping"
                    --health-interval 5s --health-timeout 5s --health-retries 15
            postgres:
                image: postgres:17.11-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
                env:
                    POSTGRES_DB: payments_test_ci
                    POSTGRES_PASSWORD: payments-ci-admin-only
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d payments_test_ci"
                    --health-interval 2s --health-timeout 3s --health-retries 15
        env:
            APP_ENV: test
            DB_HOST: 127.0.0.1
            DB_PORT: "5432"
            DB_NAME: payments_test_ci
            DB_USER: app_pagos
            DB_PASSWORD: payments-ci-runtime-only
            DB_SSL: "false"
            PAYMENTS_MIGRATION_PASSWORD: payments-ci-migration-only
            PAYMENTS_VERIFY_POSTGRES: "true"
            PAYMENTS_VERIFY_RABBITMQ: "true"
            RABBITMQ_ENABLED: "true"
            RABBITMQ_URI: amqp://payments_test_ci-consumer:payments-ci-runtime-only@127.0.0.1:5672/payments_test_ci
            PAYMENTS_TEST_RABBITMQ_URI: amqp://clusterjam:local-development-only@127.0.0.1:5672/payments_test_ci
            PAYMENTS_RABBITMQ_VHOST: payments_test_ci
            PAYMENTS_BROKER_ADMIN_PASSWORD: local-development-only
            PAYMENTS_RABBITMQ_PASSWORD: payments-ci-runtime-only
        defaults:
            run:
                working-directory: services/paymentsService
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
              with:
                  node-version: "24"
                  cache: npm
                  cache-dependency-path: services/paymentsService/package-lock.json
            - run: npm ci --ignore-scripts --no-audit --no-fund
            - run: npm run build
            - run: npm run typecheck
            - run: npm run lint
            - run: npm run format:check
            - name: Initialize disposable broker topology
              run: python3 ../../infra/payments/provision-local.py
            - name: Initialize disposable database roles
              run: >-
                  docker exec -i -e DB_PASSWORD -e PAYMENTS_MIGRATION_PASSWORD
                  ${{ job.services.postgres.id }} psql -U postgres -d payments_test_ci
                  < ../../infra/payments/postgres/001-bootstrap.sql
            - run: npm test
            - name: Build runtime image
              working-directory: .
              run: docker build -f services/paymentsService/Dockerfile -t cluster-jam/payments:ci .
