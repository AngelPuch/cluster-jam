name: Payments CI

on:
    pull_request:
        paths:
            - "services/paymentsService/**"
            - "infra/payments/**"
            - ".github/workflows/payments-ci.yml"
    push:
        branches: [main]
        paths:
            - "services/paymentsService/**"
            - "infra/payments/**"
            - ".github/workflows/payments-ci.yml"

permissions:
    contents: read

concurrency:
    group: payments-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    payments:
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        defaults:
            run:
                working-directory: services/paymentsService
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
              with:
                  node-version: "24"
                  cache: npm
                  cache-dependency-path: services/paymentsService/package-lock.json
            - run: npm ci --ignore-scripts --no-audit --no-fund
            - run: npm run build
            - run: npm run typecheck
            - run: npm run lint
            - run: npm run format:check
            - run: npm test
            - name: Build runtime image
              working-directory: .
              run: docker build -f services/paymentsService/Dockerfile -t cluster-jam/payments:ci .
