<!doctype html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Confirma tu correo en Cluster JAM</title>
    </head>
    <body style="font-family: Arial, sans-serif; color: #172033">
        <h2>Confirma tu correo en Cluster JAM</h2>
        <p>
            Escribe este código de seis dígitos en la pantalla de confirmación:
        </p>
        <p style="font-size: 32px; font-weight: bold; letter-spacing: 6px">
            {{ .Token }}
        </p>
        <p>El código es de un solo uso y tiene una vigencia limitada.</p>
        <p>No compartas este código con nadie.</p>
        <p>Si no solicitaste esta cuenta, puedes ignorar este correo.</p>
    </body>
</html>
