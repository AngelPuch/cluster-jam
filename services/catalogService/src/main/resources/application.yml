spring:
    rabbitmq:
        host: "${CATALOG_RABBITMQ_HOST:127.0.0.1}"
        port: "${CATALOG_RABBITMQ_PORT:5672}"
        virtual-host: "${CATALOG_RABBITMQ_VHOST:clusterjam}"
        username: "${CATALOG_RABBITMQ_USER:catalog-consumer}"
        password: "${CATALOG_RABBITMQ_PASSWORD:}"
        dynamic: false
        connection-timeout: 3s
        requested-heartbeat: 30s
        ssl:
            enabled: "${CATALOG_RABBITMQ_TLS:false}"
            validate-server-certificate: true
            verify-hostname: true
    jackson:
        deserialization:
            fail-on-unknown-properties: true
    servlet:
        multipart:
            max-file-size: 10000000B
            max-request-size: 10100000B
    main:
        banner-mode: off
        log-startup-info: false
    application:
        name: catalog-service
    datasource:
        url: "${CATALOG_DB_URL:jdbc:postgresql://127.0.0.1:5436/catalogo_db}"
        username: "${CATALOG_DB_USER:app_catalogo}"
        password: "${CATALOG_DB_PASSWORD:}"
        hikari:
            minimum-idle: 0
            maximum-pool-size: 8
            connection-timeout: 1000
            validation-timeout: 500
            initialization-fail-timeout: -1
            data-source-properties:
                "[connectTimeout]": "2"
                "[socketTimeout]": "3"
                "[cancelSignalTimeout]": "1"
    jdbc:
        template:
            query-timeout: 2s
    jpa:
        open-in-view: false
        hibernate:
            ddl-auto: none
        properties:
            "[hibernate.boot.allow_jdbc_metadata_access]": "false"
            "[hibernate.jdbc.log.errors]": "false"
            "[jakarta.persistence.database-product-name]": "PostgreSQL"
    sql:
        init:
            mode: never

server:
    address: "${HTTP_ADDRESS:127.0.0.1}"
    port: "${HTTP_PORT:8083}"
    max-http-request-header-size: 16KB
    error:
        include-message: never
        include-stacktrace: never
        include-exception: false
        include-binding-errors: never

catalog:
    reservations:
        expiration-enabled: "${CATALOG_RESERVATION_EXPIRATION_ENABLED:true}"
    messaging:
        enabled: "${CATALOG_MESSAGING_ENABLED:false}"
    environment: "${APP_ENV:development}"
    reads:
        cursor-key: "${CATALOG_CURSOR_KEY:}"
    photos:
        bucket: "${CATALOG_PHOTOS_BUCKET:catalog-photos}"
        key: "${CATALOG_STORAGE_KEY:}"
        cleanup-delay-ms: "${CATALOG_PHOTO_CLEANUP_DELAY_MS:60000}"

    security:
        supabase-url: "${SUPABASE_URL:}"
        service-jwt-issuer: "${SERVICE_JWT_ISSUER:}"
        writes-per-minute: "${CATALOG_WRITES_PER_MINUTE:30}"
        max-json-bytes: "${CATALOG_MAX_JSON_BYTES:65536}"

springdoc:
    api-docs:
        enabled: "${CATALOG_DOCS_ENABLED:false}"
        path: /openapi.json
    swagger-ui:
        enabled: "${CATALOG_DOCS_ENABLED:false}"
        path: /docs
        disable-swagger-default-url: true
    paths-to-match: /health/**,/api/v1/**
    writer-with-order-by-keys: true
    writer-with-default-pretty-printer: true

logging:
    level:
        root: WARN
        org.springframework.web.servlet.PageNotFound: ERROR
        com.clusterjam.catalog: "${LOG_LEVEL:INFO}"
    structured:
        format:
            console: logstash
        json:
            exclude: "@timestamp,@version,level_value,thread_name,logger_name,stack_trace"
            customizer: com.clusterjam.catalog.infrastructure.observability.UtcLogTimestamp
            add:
                service_name: "${spring.application.name}"
                service_version: "${SERVICE_VERSION:@project.version@}"
                environment: "${catalog.environment}"
                instance_id: "${INSTANCE_ID:${random.uuid}}"
