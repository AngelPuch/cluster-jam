listeners.tcp = none
listeners.ssl.default = 5671
ssl_options.cacertfile = /run/config/cluster-ca.crt
ssl_options.certfile = /run/config/rabbitmq.crt
ssl_options.keyfile = /run/secrets/rabbitmq_key
ssl_options.versions.1 = tlsv1.3
ssl_options.versions.2 = tlsv1.2
ssl_options.verify = verify_none
ssl_options.fail_if_no_peer_cert = false
definitions.import_backend = local_filesystem
definitions.local.path = /run/secrets/rabbitmq_definitions
definitions.skip_if_unchanged = true
log.console = true
log.console.level = warning
log.file = false
vm_memory_high_watermark.absolute = 512MiB
disk_free_limit.absolute = 1GB
