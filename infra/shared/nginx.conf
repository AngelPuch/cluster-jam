worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;

events {
    worker_connections 1024;
}

http {
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    map $uri $route_family {
        default unmatched;
        ~^/api/v1/(registrations|sessions|session-renewals|password-recoveries|password-recovery-requests)(/|$) auth;
        ~^/api/v1/(files|prints|admin/(prints|template-versions|design-drafts))(/|$) personalization;
        ~^/api/v1/profiles/me(/|$) profile;
        ~^/(health|docs|openapi.json|openapi|contracts)(/|$) operational;
    }
    map $uri $write_access_log {
        default 1;
        ~^/health/ 0;
    }
    map $request_method $safe_method {
        default OTHER;
        GET GET;
        POST POST;
        PUT PUT;
        PATCH PATCH;
        DELETE DELETE;
        HEAD HEAD;
        OPTIONS OPTIONS;
    }
    map $status $safe_level {
        default INFO;
        ~^5 ERROR;
        429 WARN;
    }
    map $upstream_http_x_trace_id $fallback_trace_id {
        default $request_id;
        "~^[0-9a-f]{32}$" $upstream_http_x_trace_id;
    }
    map $upstream_http_traceparent $correlation_trace_id {
        default $fallback_trace_id;
        "~^00-(?<upstream_trace_id>[0-9a-f]{32})-[0-9a-f]{16}-[0-9a-f]{2}$" $upstream_trace_id;
    }
    log_format safe_json escape=json
        '{"timestamp":"$time_iso8601","level":"$safe_level",'
        '"service_name":"nginx","service_version":"1.30.6",'
        '"environment":"staging","instance_id":"$hostname",'
        '"event":"http.request.completed","message":"Proxy request completed.",'
        '"trace_id":"$correlation_trace_id","span_id":null,"request_id":"$request_id",'
        '"http_method":"$safe_method","http_route":"$route_family",'
        '"status_code":$status,"duration_seconds":$request_time}';
    access_log /dev/stdout safe_json if=$write_access_log;
    limit_req_zone $binary_remote_addr zone=auth_requests:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=personalization_requests:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=personalization_uploads:10m rate=1r/s;
    limit_req_zone $binary_remote_addr zone=profile_requests:10m rate=20r/s;

    server {
        listen 127.0.0.1:8080;
        access_log off;
        location = /health/live {
            default_type application/json;
            return 200 '{"status":"ok"}';
        }
        location / { return 404; }
    }

    server {
        listen 8443 ssl default_server;
        http2 on;
        server_name _;
        ssl_certificate /run/config/https.crt;
        ssl_certificate_key /run/secrets/https_key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        ssl_session_cache shared:TLS:10m;
        client_max_body_size 64k;
        client_header_timeout 15s;
        client_body_timeout 30s;
        send_timeout 30s;
        keepalive_timeout 30s;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
        add_header Strict-Transport-Security "max-age=86400" always;
        error_page 400 497 = @bad_request;
        error_page 408 = @request_timeout;
        error_page 414 = @uri_too_long;
        error_page 431 494 = @headers_too_large;
        error_page 413 = @body_too_large;
        error_page 429 = @rate_limited;
        error_page 502 504 = @unavailable;

        set $auth_backend http://clusterjam-auth:8080;
        set $personalization_backend http://clusterjam-personalization:8080;
        set $profile_backend http://clusterjam-profile:8080;

        location ~ ^/api/v1/profiles/me(/|$) {
            limit_req zone=profile_requests burst=40 nodelay;
            limit_req_status 429;
            include /etc/nginx/cluster-proxy.conf;
            proxy_pass $profile_backend;
        }
        location ~ ^/docs/profile(/|$) {
            include /etc/nginx/cluster-proxy.conf;
            proxy_pass $profile_backend;
        }
        location = /openapi/profile.json {
            include /etc/nginx/cluster-proxy.conf;
            proxy_pass $profile_backend;
        }
        location = /health/profile/live {
            include /etc/nginx/cluster-proxy.conf;
            proxy_pass $profile_backend/health/live;
        }
        location = /health/profile/ready {
            include /etc/nginx/cluster-proxy.conf;
            proxy_pass $profile_backend/health/ready;
        }

        location = /api/v1/files {
            limit_req zone=personalization_uploads burst=2 nodelay;
            limit_req_status 429;
            # 10,000,000 file bytes + the same multipart allowance as ASGI.
            client_max_body_size 10131072;
            include /etc/nginx/cluster-proxy.conf;
            proxy_pass $personalization_backend;
        }
        location ~ ^/api/v1/(files|prints|admin/(prints|template-versions|design-drafts))(/|$) {
            limit_req zone=personalization_requests burst=40 nodelay;
            limit_req_status 429;
            client_max_body_size 256k;
            include /etc/nginx/cluster-proxy.conf;
            proxy_pass $personalization_backend;
        }
        location = /health/personalization/live {
            include /etc/nginx/cluster-proxy.conf;
            proxy_pass $personalization_backend/health/live;
        }
        location = /health/personalization/ready {
            include /etc/nginx/cluster-proxy.conf;
            proxy_pass $personalization_backend/health/ready;
        }
        location = /openapi/personalization.json {
            include /etc/nginx/cluster-proxy.conf;
            proxy_pass $personalization_backend/openapi.json;
        }

        location ~ ^/api/v1/(registrations|sessions|session-renewals|password-recoveries|password-recovery-requests)(/|$) {
            limit_req zone=auth_requests burst=10 nodelay;
            limit_req_status 429;
            client_max_body_size 64k;
            include /etc/nginx/cluster-proxy.conf;
            proxy_buffering off;
            proxy_pass $auth_backend;
        }
        location ~ ^/docs(/|$) {
            include /etc/nginx/cluster-proxy.conf;
            proxy_pass $auth_backend;
        }
        location = /openapi.json {
            include /etc/nginx/cluster-proxy.conf;
            proxy_pass $auth_backend;
        }
        location = /health/auth/live {
            include /etc/nginx/cluster-proxy.conf;
            proxy_pass $auth_backend/health/live;
        }
        location = /health/auth/ready {
            include /etc/nginx/cluster-proxy.conf;
            proxy_pass $auth_backend/health/ready;
        }
        location @bad_request {
            default_type application/problem+json;
            return 400 '{"type":"about:blank","title":"Bad request","status":400,"detail":"The gateway rejected this request.","instance":"urn:request:$request_id","code":"INVALID_REQUEST","traceId":"$request_id"}';
        }
        location @request_timeout {
            default_type application/problem+json;
            return 408 '{"type":"about:blank","title":"Request timeout","status":408,"detail":"The request did not arrive in time.","instance":"urn:request:$request_id","code":"REQUEST_TIMEOUT","traceId":"$request_id"}';
        }
        location @uri_too_long {
            default_type application/problem+json;
            return 414 '{"type":"about:blank","title":"URI too long","status":414,"detail":"The request URI exceeds the gateway limit.","instance":"urn:request:$request_id","code":"URI_TOO_LONG","traceId":"$request_id"}';
        }
        location @headers_too_large {
            default_type application/problem+json;
            return 431 '{"type":"about:blank","title":"Headers too large","status":431,"detail":"The request headers exceed the gateway limit.","instance":"urn:request:$request_id","code":"HEADERS_TOO_LARGE","traceId":"$request_id"}';
        }
        location @body_too_large {
            default_type application/problem+json;
            return 413 '{"type":"about:blank","title":"Request body too large","status":413,"detail":"The request exceeds the gateway limit.","instance":"urn:request:$request_id","code":"REQUEST_BODY_TOO_LARGE","traceId":"$request_id"}';
        }
        location @rate_limited {
            default_type application/problem+json;
            return 429 '{"type":"about:blank","title":"Too many requests","status":429,"detail":"Try again later.","instance":"urn:request:$request_id","code":"RATE_LIMITED","traceId":"$request_id"}';
        }
        location @unavailable {
            default_type application/problem+json;
            return 503 '{"type":"about:blank","title":"Service unavailable","status":503,"detail":"The requested service is unavailable.","instance":"urn:request:$request_id","code":"SERVICE_UNAVAILABLE","traceId":"$request_id"}';
        }
        location / {
            default_type application/problem+json;
            return 404 '{"type":"about:blank","title":"Route not found","status":404,"detail":"No deployed route matches this request.","instance":"urn:request:$request_id","code":"ROUTE_NOT_FOUND","traceId":"$request_id"}';
        }
    }
}
