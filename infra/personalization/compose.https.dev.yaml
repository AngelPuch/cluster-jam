# Local HTTPS smoke/manual QA. Do not use this overlay on Ubuntu staging.
services:
    personalization:
        networks:
            backend:
                aliases: [clusterjam-personalization]
    nginx:
        image: nginx:1.30.6-trixie@sha256:51047bea59fed88fbd1f52565d2f5fabcb82d311cf6c9e507a10ce74bb3bc3f0
        user: "101:101"
        entrypoint: ["nginx"]
        command: ["-g", "daemon off;"]
        read_only: true
        cap_drop: ["ALL"]
        security_opt: ["no-new-privileges:true"]
        tmpfs:
            - /tmp:size=64m,mode=1777
        ports:
            - "127.0.0.1:${PERSONALIZATION_HTTPS_PORT:-8443}:8443"
        secrets:
            - https_key
        configs:
            - source: personalization_nginx_config
              target: /etc/nginx/nginx.conf
            - source: personalization_proxy_config
              target: /etc/nginx/cluster-proxy.conf
            - source: personalization_https_certificate
              target: /run/config/https.crt
            - source: personalization_https_ca
              target: /run/config/cluster-ca.crt
        networks: [backend]
        healthcheck:
            test: ["CMD", "curl", "-fsS", "--max-time", "2", "http://127.0.0.1:8080/health/live"]
            interval: 10s
            timeout: 3s
            start_period: 10s
            retries: 3
        restart: unless-stopped
        stop_signal: SIGQUIT
        stop_grace_period: 30s
        mem_limit: 128m
        cpus: 0.5
        pids_limit: 128
        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "3"

secrets:
    https_key:
        file: ./.secrets/grpc_server_key.pem

configs:
    personalization_nginx_config:
        file: ../shared/nginx.conf
    personalization_proxy_config:
        file: ../shared/nginx-proxy.conf
    personalization_https_certificate:
        file: ./.secrets/grpc_server_cert.pem
    personalization_https_ca:
        file: ./.secrets/grpc_ca.crt
