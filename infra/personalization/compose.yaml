name: cluster-jam-personalization

x-personalization-service: &personalization-service
    image: cluster-jam/personalization:${PERSONALIZATION_IMAGE_TAG:-0.1.0-local}
    build:
        context: ../../services/personalizationService
        target: runtime
        args:
            VCS_REF: ${PERSONALIZATION_GIT_SHA:-local}
    environment: &personalization-environment
        APP_ENV: development
        HTTP_HOST: 0.0.0.0
        HTTP_PORT: "8080"
        GRPC_PORT: "50051"
        LOG_LEVEL: INFO
        STORAGE_ENABLED: "false"
        SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-personalization-originals}
        DOWNLOAD_URL_TTL_SECONDS: ${DOWNLOAD_URL_TTL_SECONDS:-60}
        MIN_PRINT_DPI: ${MIN_PRINT_DPI:-}
        IMAGE_MAX_WIDTH_PX: ${IMAGE_MAX_WIDTH_PX:-8192}
        IMAGE_MAX_HEIGHT_PX: ${IMAGE_MAX_HEIGHT_PX:-8192}
        IMAGE_MAX_PIXELS: ${IMAGE_MAX_PIXELS:-16000000}
        SUPABASE_ISSUER: ${SUPABASE_ISSUER:?Set SUPABASE_ISSUER}
        SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL:?Set SUPABASE_JWKS_URL}
        DB_HOST: db-personalizacion
        DB_PORT: "5432"
        DB_NAME: personalizacion_db
        DB_USER: app_personalizacion
        DB_SCHEMA: app
        DB_CONNECT_TIMEOUT_SECONDS: "5"
        DB_PASSWORD_FILE: /run/secrets/personalization_db_password
    secrets:
        - personalization_db_password
    networks:
        - personalization-db
    depends_on:
        db-personalizacion:
            condition: service_healthy
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 64

services:
    db-personalizacion:
        image: postgres:17.11-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
        environment:
            POSTGRES_DB: personalizacion_db
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD_FILE: /run/secrets/personalization_db_admin_password
            POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
        secrets:
            - personalization_db_admin_password
            - personalization_db_password
        volumes:
            - personalization-data:/var/lib/postgresql/data
            - ./postgres:/docker-entrypoint-initdb.d:ro
        networks:
            - personalization-db
        healthcheck:
            test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "personalizacion_db"]
            interval: 5s
            timeout: 3s
            start_period: 10s
            retries: 12
        restart: unless-stopped
        stop_grace_period: 30s
        mem_limit: 512m
        cpus: 1.0
        pids_limit: 128

    personalization:
        <<: *personalization-service
        networks:
            - personalization-db
            - backend
        init: true
        tmpfs:
            - /tmp:rw,noexec,nosuid,size=32m,mode=1777
        restart: unless-stopped
        stop_grace_period: 20s
        healthcheck:
            test:
                - CMD
                - python
                - -c
                - >-
                  import urllib.request;
                  urllib.request.urlopen('http://127.0.0.1:8080/health/live', timeout=2).close()
            interval: 10s
            timeout: 3s
            start_period: 10s
            retries: 3

    personalization-worker:
        <<: *personalization-service
        profiles: ["images"]
        command: ["python", "-m", "personalization.interfaces.workers.images"]
        init: true
        restart: unless-stopped
        stop_grace_period: 120s
        mem_limit: 512m
        environment:
            <<: *personalization-environment
            WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-10}
            WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-10}

    personalization-grpc:
        <<: *personalization-service
        profiles: ["rpc"]
        networks:
            - personalization-db
            - backend
        command: ["python", "-m", "personalization.interfaces.grpc.server"]
        init: true
        restart: unless-stopped
        stop_grace_period: 20s
        environment:
            <<: *personalization-environment
            GRPC_HOST: 0.0.0.0
            GRPC_TLS_CERTIFICATE_FILE: /run/secrets/grpc_server_certificate
            GRPC_TLS_KEY_FILE: /run/secrets/grpc_server_key
            GRPC_HEALTH_CA_FILE: /run/secrets/grpc_trusted_ca
        secrets:
            - personalization_db_password
            - grpc_server_certificate
            - grpc_server_key
            - grpc_trusted_ca
        healthcheck:
            test: ["CMD", "python", "-m", "personalization.interfaces.grpc.health"]
            interval: 10s
            timeout: 4s
            start_period: 10s
            retries: 3

    personalization-storage:
        <<: *personalization-service
        profiles: ["tools"]
        entrypoint: ["python", "-m", "personalization.infrastructure.storage.manage"]
        command: ["check"]
        restart: "no"

    personalization-migrate:
        <<: *personalization-service
        profiles: ["tools"]
        command: ["python", "-m", "personalization.infrastructure.database.migrate", "upgrade"]
        restart: "no"

    personalization-db-test:
        <<: *personalization-service
        profiles: ["tools"]
        image: cluster-jam/personalization-tests:${PERSONALIZATION_IMAGE_TAG:-0.1.0-local}
        build:
            context: ../../services/personalizationService
            target: integration
        environment:
            <<: *personalization-environment
            APP_ENV: test
            PERSONALIZATION_DATABASE_INTEGRATION: "1"
        read_only: false
        restart: "no"

    personalization-check:
        <<: *personalization-service
        profiles: ["tools"]
        command: ["python", "-m", "personalization.infrastructure.database.check"]
        restart: "no"

networks:
    personalization-db:
        internal: true
    backend:

volumes:
    personalization-data:

secrets:
    personalization_db_admin_password:
        file: ./.secrets/postgres_admin_password
    personalization_db_password:
        file: ./.secrets/personalization_db_password
    grpc_server_certificate:
        file: ./.secrets/grpc_server_cert.pem
    grpc_server_key:
        file: ./.secrets/grpc_server_key.pem
    grpc_trusted_ca:
        file: ./.secrets/grpc_ca.crt
